name: Build Bright Smart Shop APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile-app/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install mobile-app dependencies
        working-directory: mobile-app
        run: npm ci

      - name: Build Vite web assets
        working-directory: mobile-app
        run: npm run build

      - name: Install Capacitor CLI globally
        run: npm install -g @capacitor/cli@6.2.0

      - name: Sync Capacitor Android project
        working-directory: mobile-app
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        working-directory: mobile-app/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: mobile-app/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp mobile-app/android/app/build/outputs/apk/debug/app-debug.apk artifacts/Bright-Smart-Shop.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bright-Smart-Shop-APK
          path: artifacts/Bright-Smart-Shop.apk
          retention-days: 30
